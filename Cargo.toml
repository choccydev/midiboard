[package]
name = "midiboard"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "CLI tool to trigger arbitrary commands using any MIDI 1.0 compatible device."
homepage = "https://github.com/aordano/midiboard"
repository = "https://github.com/aordano/midiboard"
documentation = "https://github.com/aordano/midiboard/tree/master/docs"
readme = "README.md"

[dependencies]
midir = "0.11"
clap = "4.6"
config = "0.15"
serde = { version = "1", features = ["derive"] }
home = "0.5"
colored = "3"
rust-embed = "8"
anyhow = "1"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
rand = "0.8"
