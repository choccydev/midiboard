[package]
name = "midiboard"
version = "0.5.0"
edition = "2024"
license = "MIT"
authors = ["Agata Ordano <gh@choccymilk.dev>"]
description = "Run commands from any MIDI 1.0 controller, with encoder handling and LED feedback."
homepage = "https://github.com/choccydev/midiboard"
repository = "https://github.com/choccydev/midiboard"
documentation = "https://github.com/choccydev/midiboard/tree/master/docs"
readme = "README.md"
keywords = ["midi", "controller", "automation", "cli"]
categories = ["command-line-utilities", "multimedia::audio"]
exclude = ["PLAN.md", ".github/"]

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
crossbeam-channel = "0.5"
ctrlc = { version = "3", features = ["termination"] }
home = "0.5"
midir = "0.11"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
jsonschema = { version = "0.33", default-features = false }
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
